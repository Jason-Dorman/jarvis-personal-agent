wake_word:
  model: hey_jarvis
  sensitivity: 0.5
followup_window_seconds: 8
push_to_talk_hotkey: "ctrl+space"   # v1 uses the HUD's hold-Space; global hook comes later

audio:
  input_device: null        # null = Windows default mic; or part of a device name
  output_device: null       # null = Windows default speakers; e.g. "USB Audio"

vad:
  threshold: 0.5            # speech probability that counts as talking
  silence_seconds: 0.7      # stop listening after this much quiet

stt:
  model: small.en
  device: auto              # auto (CUDA if it works, else CPU) | cuda | cpu
  vocab: [USDC, USDT, Tether, perps, RWA, Hyperliquid, basis, T-bills, stablecoin, watchlist]

brain:
  default_model: sonnet
  deep_model: opus
  effort: medium            # low | medium | high | xhigh | max (tune in Chunk 3)
  max_spoken_sentences: 3

tts:
  voice: en_US-ryan-medium

brief:
  move_threshold_pct: 3     # watchlist moves smaller than this are skipped

watchlist_file: notes/watchlist.md
theses_file: notes/theses.md
news_feeds:
  - https://www.coindesk.com/arc/outboundfeeds/rss/
  - https://www.theblock.co/rss.xml
  - https://www.federalreserve.gov/feeds/press_all.xml

debug: false                # true lets audio touch disk for troubleshooting
