[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice assistant for markets, crypto, and fintech"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.2.174",
    "yfinance>=1.7.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "openwakeword>=0.4.0",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false  # run from the repo root; nothing to install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hud/index.html"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
